# SPDX-License-Identifier: LGPL-2.1-or-later
#
# Builds toolchain <id> in a fresh VM from its pinned Tart image on the
# self-hosted Mac, attests it, and publishes it (with the sources MacPorts
# downloaded) as the release toolchain-<id>-macos-x86_64. Builds then install
# it from there, pinned by sha256 in toolchains/<id>.sh.
#
# Manual only; never on pull requests (plan.md, section 2).

name: toolchain

on:
  workflow_dispatch:
    inputs:
      id:
        description: Toolchain id (toolchains/<id>.sh)
        required: true

permissions: {}

concurrency:
  group: toolchain-${{ inputs.id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, wmb-tart]
    timeout-minutes: 600
    permissions:
      contents: read
    env:
      ID: ${{ inputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build in a fresh VM
        run: |
          [[ -f "toolchains/$ID.sh" ]] || { echo "::error::no toolchains/$ID.sh"; exit 1; }
          name="toolchain-$ID-macos-x86_64"
          out="$WMB_VM_SHARE/out"
          rm -f "$out/$name".tar.xz "$out/$name"-sources.tar.xz
          ./wmb vm toolchain "$ID" --archive
          rm -rf dist; mkdir dist
          mv "$out/$name".tar.xz "$out/$name"-sources.tar.xz dist/
          (cd dist && shasum -a 256 ./*.tar.xz | sed 's| \./| |' > "$name.SHA256SUMS" && cat "$name.SHA256SUMS")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-${{ inputs.id }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      ID: ${{ inputs.id }}
      NAME: toolchain-${{ inputs.id }}-macos-x86_64
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolchain-${{ inputs.id }}
          path: dist

      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum -c ./*.SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.xz

      # Published, not a draft: builds download it without credentials.
      - name: Publish the release
        run: |
          if gh release view "$NAME" >/dev/null 2>&1; then
            echo "::error::release $NAME already exists; toolchains are never replaced"
            exit 1
          fi
          gh release create "$NAME" --target "$GITHUB_SHA" --title "$NAME" \
            --notes "Toolchain $ID: see toolchains/$ID.sh. Built by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Pin TOOLCHAIN_ARCHIVE_SHA256 from $NAME.SHA256SUMS." \
            dist/*

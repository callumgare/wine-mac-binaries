# SPDX-License-Identifier: LGPL-2.1-or-later
#
# Builds toolchain <id> in a fresh VM from its pinned Tart image on the
# self-hosted Mac, attests it, and pushes it (with the sources MacPorts
# downloaded) to ghcr.io/<owner>/wine-mac-binaries/toolchain:<id> as an OCI
# artifact. Builds then install it from there, pinned by sha256 in
# toolchains/<id>.sh. Not a GitHub release, so the releases page only lists
# Wine builds (plan.md, "Never-delete enforcement").
#
# Manual only; never on pull requests (plan.md, section 2).

name: toolchain

on:
  workflow_dispatch:
    inputs:
      id:
        description: Toolchain id (toolchains/<id>.sh)
        required: true

permissions: {}

concurrency:
  group: toolchain-${{ inputs.id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, wmb-tart]
    timeout-minutes: 600
    permissions:
      contents: read
    env:
      ID: ${{ inputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build in a fresh VM
        run: |
          [[ -f "toolchains/$ID.sh" ]] || { echo "::error::no toolchains/$ID.sh"; exit 1; }
          name="toolchain-$ID-macos-x86_64"
          out="$WMB_VM_SHARE/out"
          rm -f "$out/$name".tar.xz "$out/$name"-sources.tar.xz
          ./wmb vm toolchain "$ID" --archive &
          echo $! > "$RUNNER_TEMP/vm.pid"
          wait $!
          rm -rf dist; mkdir dist
          mv "$out/$name".tar.xz "$out/$name"-sources.tar.xz dist/
          (cd dist && shasum -a 256 ./*.tar.xz | sed 's| \./| |' > "$name.SHA256SUMS" && cat "$name.SHA256SUMS")

      # A cancelled or timed-out step leaves vm.sh running (the runner
      # doesn't stop it), and with it the VM. SIGTERM runs vm.sh's cleanup,
      # which shuts the VM down and deletes it.
      - name: Stop the VM if the build didn't finish
        if: always()
        timeout-minutes: 5
        run: |
          pid="$(cat "$RUNNER_TEMP/vm.pid" 2>/dev/null)" || exit 0
          if ps -p "$pid" -o command= | grep -q 'build/vm\.sh'; then
            echo "Stopping vm.sh ($pid)"
            kill -TERM "$pid"
            while kill -0 "$pid" 2>/dev/null; do sleep 5; done
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-${{ inputs.id }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      packages: write
      id-token: write
      attestations: write
    env:
      ID: ${{ inputs.id }}
      NAME: toolchain-${{ inputs.id }}-macos-x86_64
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolchain-${{ inputs.id }}
          path: dist

      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum -c ./*.SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.xz

      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      # Each file is its own layer, so a layer's digest is the file's sha256
      # and builds fetch it by the sha256 in toolchains/<id>.sh.
      - name: Push to GitHub's container registry
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY,,}/toolchain:$ID"
          echo "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if oras manifest fetch "$ref" >/dev/null 2>&1; then
            echo "::error::$ref already exists; a toolchain id is never reused"
            exit 1
          fi
          oras push "$ref" \
            --artifact-type application/vnd.wmb.toolchain.v1 \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.description=Toolchain $ID: see toolchains/$ID.sh. Built by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID." \
            "$NAME.tar.xz:application/x-xz" \
            "$NAME-sources.tar.xz:application/x-xz" \
            "$NAME.SHA256SUMS:text/plain"
          {
            echo "Pushed \`$ref\`. Pin in toolchains/$ID.sh:"
            echo '```'
            grep " $NAME.tar.xz\$" "$NAME.SHA256SUMS" | sed 's/^\([0-9a-f]*\).*/TOOLCHAIN_ARCHIVE_SHA256="\1"/'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
